<script>
/* =====================================================================
   Drive Mode core — pure parsing logic (no DOM / browser APIs used).
   HLS playlist parsing, MPEG-TS demuxing (H.264 + AAC), SPS parsing,
   and a minimal MP4 demuxer. Shared by player.html and Node tests.
   ===================================================================== */

function dmConcat(a, b) {
  if (!a || a.length === 0) return b;
  if (!b || b.length === 0) return a;
  var out = new Uint8Array(a.length + b.length);
  out.set(a, 0); out.set(b, a.length);
  return out;
}
function dmHex2(n) { return ('0' + (n & 0xff).toString(16)).slice(-2); }

/* ---------------- Bit reader + H.264 SPS parsing ---------------- */

function DmBitReader(bytes) { this.b = bytes; this.pos = 0; }
DmBitReader.prototype.bit = function () {
  var byte = this.b[this.pos >> 3] || 0;
  var v = (byte >> (7 - (this.pos & 7))) & 1;
  this.pos++; return v;
};
DmBitReader.prototype.bits = function (n) {
  var v = 0;
  for (var i = 0; i < n; i++) v = v * 2 + this.bit();
  return v;
};
DmBitReader.prototype.ue = function () {
  var zeros = 0;
  while (this.bit() === 0 && zeros < 31) zeros++;
  if (zeros === 0) return 0;
  return Math.pow(2, zeros) - 1 + this.bits(zeros);
};
DmBitReader.prototype.se = function () {
  var v = this.ue();
  return (v & 1) ? (v + 1) >> 1 : -(v >> 1);
};

function dmRbsp(nal) {
  // nal includes the 1-byte NAL header; returns RBSP bytes after the header
  // with emulation-prevention bytes (00 00 03 -> 00 00) removed.
  var out = [];
  var zeros = 0;
  for (var i = 1; i < nal.length; i++) {
    var c = nal[i];
    if (zeros >= 2 && c === 3 && i + 1 < nal.length) { zeros = 0; continue; }
    out.push(c);
    zeros = (c === 0) ? zeros + 1 : 0;
  }
  return new Uint8Array(out);
}

function dmSkipScalingList(r, size) {
  var lastScale = 8, nextScale = 8;
  for (var j = 0; j < size; j++) {
    if (nextScale !== 0) {
      var delta = r.se();
      nextScale = (lastScale + delta + 256) % 256;
    }
    lastScale = (nextScale === 0) ? lastScale : nextScale;
  }
}

function dmParseSPS(nal) {
  // nal = full SPS NAL unit including header byte. Returns {width,height,profile,level}.
  var r = new DmBitReader(dmRbsp(nal));
  var profile = r.bits(8);
  r.bits(8); // constraint flags + reserved
  var level = r.bits(8);
  r.ue(); // seq_parameter_set_id
  var chroma = 1;
  if ([100, 110, 122, 244, 44, 83, 86, 118, 128, 138, 139, 134, 135].indexOf(profile) >= 0) {
    chroma = r.ue();
    if (chroma === 3) r.bit(); // separate_colour_plane_flag
    r.ue(); r.ue(); // bit_depth_luma/chroma_minus8
    r.bit(); // qpprime_y_zero_transform_bypass_flag
    if (r.bit()) { // seq_scaling_matrix_present_flag
      var n = (chroma !== 3) ? 8 : 12;
      for (var i = 0; i < n; i++) {
        if (r.bit()) dmSkipScalingList(r, i < 6 ? 16 : 64);
      }
    }
  }
  r.ue(); // log2_max_frame_num_minus4
  var pocType = r.ue();
  if (pocType === 0) { r.ue(); }
  else if (pocType === 1) {
    r.bit(); r.se(); r.se();
    var cyc = r.ue();
    for (var k = 0; k < cyc; k++) r.se();
  }
  r.ue(); // max_num_ref_frames
  r.bit(); // gaps_in_frame_num_value_allowed_flag
  var wMbs = r.ue() + 1;
  var hMap = r.ue() + 1;
  var frameMbsOnly = r.bit();
  if (!frameMbsOnly) r.bit(); // mb_adaptive_frame_field_flag
  r.bit(); // direct_8x8_inference_flag
  var cropL = 0, cropR = 0, cropT = 0, cropB = 0;
  if (r.bit()) { cropL = r.ue(); cropR = r.ue(); cropT = r.ue(); cropB = r.ue(); }
  var subW = 1, subH = 1;
  if (chroma === 1) { subW = 2; subH = 2; }
  else if (chroma === 2) { subW = 2; subH = 1; }
  else if (chroma === 3) { subW = 1; subH = 1; }
  var cropUnitX = (chroma === 0) ? 1 : subW;
  var cropUnitY = (chroma === 0) ? (2 - frameMbsOnly) : subH * (2 - frameMbsOnly);
  var width = wMbs * 16 - (cropL + cropR) * cropUnitX;
  var height = (2 - frameMbsOnly) * hMap * 16 - (cropT + cropB) * cropUnitY;
  return { width: width, height: height, profile: profile, level: level };
}

function dmBuildAvcc(sps, pps) {
  var out = new Uint8Array(11 + sps.length + pps.length);
  var o = 0;
  out[o++] = 1;                 // version
  out[o++] = sps[1];            // profile
  out[o++] = sps[2];            // compatibility
  out[o++] = sps[3];            // level
  out[o++] = 0xff;              // 6 bits reserved + lengthSizeMinusOne(3) => 4-byte lengths
  out[o++] = 0xe1;              // 3 bits reserved + numSPS(1)
  out[o++] = (sps.length >> 8) & 0xff; out[o++] = sps.length & 0xff;
  out.set(sps, o); o += sps.length;
  out[o++] = 1;                 // numPPS
  out[o++] = (pps.length >> 8) & 0xff; out[o++] = pps.length & 0xff;
  out.set(pps, o);
  return out;
}
function dmAvcCodecString(sps) {
  return 'avc1.' + dmHex2(sps[1]) + dmHex2(sps[2]) + dmHex2(sps[3]);
}

function dmFirstMbInSlice(nal) {
  // First ue(v) of a slice header = first_mb_in_slice; 0 marks the
  // first slice of a picture. Used to find AU boundaries in streams
  // without access unit delimiters. -1 when unparsable.
  try { return new DmBitReader(dmRbsp(nal)).ue(); } catch (e) { return -1; }
}

/* ---------------- HLS playlist parsing ---------------- */

function dmParseAttrs(str) {
  var attrs = {}, re = /([A-Z0-9-]+)=("[^"]*"|[^,]*)/gi, m;
  while ((m = re.exec(str)) !== null) {
    var v = m[2];
    if (v.length >= 2 && v[0] === '"') v = v.slice(1, -1);
    attrs[m[1].toUpperCase()] = v;
  }
  return attrs;
}

function dmParsePlaylist(text, baseUrl) {
  var lines = text.split(/\r?\n/);
  var out = {
    isMaster: false, variants: [], audioRenditions: [],
    segments: [], targetDuration: 0, mediaSequence: 0,
    endList: false, totalDuration: 0, encrypted: false, hasMap: false, playlistType: '',
    startOffset: 0
  };
  var pendingInf = null, pendingDur = null, pendingDisc = false;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    if (line.indexOf('#EXT-X-STREAM-INF:') === 0) {
      out.isMaster = true;
      pendingInf = dmParseAttrs(line.slice(18));
    } else if (line.indexOf('#EXT-X-MEDIA:') === 0) {
      var a = dmParseAttrs(line.slice(13));
      if (a.TYPE === 'AUDIO' && a.URI) {
        out.audioRenditions.push({
          uri: new URL(a.URI, baseUrl).href,
          group: a['GROUP-ID'] || '', name: a.NAME || '',
          isDefault: a.DEFAULT === 'YES'
        });
      }
    } else if (line.indexOf('#EXT-X-TARGETDURATION:') === 0) {
      out.targetDuration = parseFloat(line.slice(23)) || 0;
    } else if (line.indexOf('#EXT-X-MEDIA-SEQUENCE:') === 0) {
      out.mediaSequence = parseInt(line.slice(23), 10) || 0;
    } else if (line.indexOf('#EXTINF:') === 0) {
      pendingDur = parseFloat(line.slice(8)) || 0;
    } else if (line.indexOf('#EXT-X-START:') === 0) {
      // Where playback should begin (Plex: the resume/seek point; the
      // segments before it are empty placeholders).
      var so = parseFloat(dmParseAttrs(line.slice(13))['TIME-OFFSET']);
      if (so > 0) out.startOffset = so;
    } else if (line.indexOf('#EXT-X-PLAYLIST-TYPE:') === 0) {
      out.playlistType = line.slice(21).trim().toUpperCase();
    } else if (line === '#EXT-X-DISCONTINUITY') {
      pendingDisc = true;
    } else if (line === '#EXT-X-ENDLIST') {
      out.endList = true;
    } else if (line.indexOf('#EXT-X-KEY:') === 0) {
      var ka = dmParseAttrs(line.slice(11));
      if (ka.METHOD && ka.METHOD !== 'NONE') out.encrypted = true;
    } else if (line.indexOf('#EXT-X-MAP:') === 0) {
      out.hasMap = true;
    } else if (line[0] !== '#') {
      var uri = new URL(line, baseUrl).href;
      if (pendingInf) {
        out.variants.push({
          uri: uri,
          bandwidth: parseInt(pendingInf.BANDWIDTH, 10) || 0,
          codecs: pendingInf.CODECS || '',
          resolution: pendingInf.RESOLUTION || '',
          audioGroup: pendingInf.AUDIO || ''
        });
        pendingInf = null;
      } else if (pendingDur !== null) {
        out.segments.push({ uri: uri, duration: pendingDur, disc: pendingDisc });
        pendingDisc = false;
        out.totalDuration += pendingDur;
        pendingDur = null;
      }
    }
  }
  return out;
}

/* ---------------- MPEG-TS demuxer ----------------
   Feed bytes with push(); callbacks:
     onVideoConfig({codec, description, width, height})
     onVideoSample({data, pts, keyframe})   data = AVCC-format sample
     onAudioConfig({codec, description, sampleRate, channels})
     onAudioSample({data, pts})             data = raw AAC frame
     onUnsupported(what)                    e.g. 'hevc', 'ac3'
   Times are seconds (float). */

var DM_AAC_RATES = [96000, 88200, 64000, 48000, 44100, 32000, 24000, 22050, 16000, 12000, 11025, 8000, 7350];

function DmTsDemuxer() {
  this.buf = new Uint8Array(0);
  this.pmtPid = -1;
  this.videoPid = -1; this.audioPid = -1;
  this.videoType = -1; this.audioType = -1;
  this.pes = {};            // pid -> {chunks:[], pts, dts}
  this.sps = null; this.pps = null; this.configSent = false;
  this.hasAUD = false;
  this.lastVideoPts = 0; this.lastVideoDur = 1 / 30;
  this.audioCfg = null;
  this.onVideoConfig = null; this.onVideoSample = null;
  this.onAudioConfig = null; this.onAudioSample = null;
  this.onUnsupported = null;
}

DmTsDemuxer.prototype.push = function (chunk) {
  this.buf = dmConcat(this.buf, chunk);
  var b = this.buf, off = 0;
  // Resync to a 0x47 sync byte with another sync 188 later.
  while (off < b.length && (b[off] !== 0x47 || (off + 188 < b.length && b[off + 188] !== 0x47))) off++;
  while (b.length - off >= 188) {
    this._packet(b.subarray(off, off + 188));
    off += 188;
  }
  this.buf = b.slice(off);
};

DmTsDemuxer.prototype.flush = function () {
  for (var pid in this.pes) this._flushPes(parseInt(pid, 10));
  if (this._vstream) this._drainVideo(true); // end of stream: emit the trailing NAL/AU
};

DmTsDemuxer.prototype._packet = function (p) {
  var pusi = (p[1] & 0x40) !== 0;
  var pid = ((p[1] & 0x1f) << 8) | p[2];
  var afc = (p[3] >> 4) & 3;
  if (afc === 0 || afc === 2) return; // no payload
  var start = 4;
  if (afc === 3) start += 1 + p[4];
  if (start >= 188) return;
  var payload = p.subarray(start);
  if (pid === 0) { this._parsePat(payload, pusi); return; }
  if (pid === this.pmtPid) { this._parsePmt(payload, pusi); return; }
  if (pid === this.videoPid || pid === this.audioPid) {
    if (pusi) {
      this._flushPes(pid);
      this.pes[pid] = { chunks: [], pts: null, dts: null };
    }
    var cur = this.pes[pid];
    if (!cur) { cur = this.pes[pid] = { chunks: [], pts: null, dts: null }; }
    cur.chunks.push(new Uint8Array(payload));
  }
};

DmTsDemuxer.prototype._sectionPayload = function (payload, pusi) {
  var off = 0;
  if (pusi) off = 1 + payload[0]; // pointer_field
  return payload.subarray(Math.min(off, payload.length));
};

DmTsDemuxer.prototype._parsePat = function (payload, pusi) {
  var s = this._sectionPayload(payload, pusi);
  if (s.length < 12 || s[0] !== 0) return;
  var sectionLength = ((s[1] & 0x0f) << 8) | s[2];
  var end = Math.min(3 + sectionLength - 4, s.length); // exclude CRC
  for (var i = 8; i + 4 <= end; i += 4) {
    var prog = (s[i] << 8) | s[i + 1];
    var pid = ((s[i + 2] & 0x1f) << 8) | s[i + 3];
    if (prog !== 0) { this.pmtPid = pid; return; }
  }
};

DmTsDemuxer.prototype._parsePmt = function (payload, pusi) {
  var s = this._sectionPayload(payload, pusi);
  if (s.length < 12 || s[0] !== 2) return;
  var sectionLength = ((s[1] & 0x0f) << 8) | s[2];
  var end = Math.min(3 + sectionLength - 4, s.length);
  var progInfoLen = ((s[10] & 0x0f) << 8) | s[11];
  var i = 12 + progInfoLen;
  while (i + 5 <= end) {
    var type = s[i];
    var pid = ((s[i + 1] & 0x1f) << 8) | s[i + 2];
    var esLen = ((s[i + 3] & 0x0f) << 8) | s[i + 4];
    if (type === 0x1b) { this.videoPid = pid; this.videoType = type; }
    else if (type === 0x24) { this.videoPid = pid; this.videoType = type; if (this.onUnsupported) this.onUnsupported('hevc'); }
    else if (type === 0x0f) { this.audioPid = pid; this.audioType = type; }
    else if (type === 0x03 || type === 0x04) { this.audioPid = pid; this.audioType = type; if (this.onUnsupported) this.onUnsupported('mp3-audio'); }
    else if (type === 0x81 || type === 0x06) { if (this.onUnsupported) this.onUnsupported('ac3-audio'); }
    i += 5 + esLen;
  }
};

function dmParsePesTimestamp(b, o) {
  return ((b[o] >> 1) & 7) * 1073741824
    + b[o + 1] * 4194304
    + ((b[o + 2] >> 1) & 0x7f) * 32768
    + b[o + 3] * 128
    + ((b[o + 4] >> 1) & 0x7f);
}

DmTsDemuxer.prototype._flushPes = function (pid) {
  var pes = this.pes[pid];
  if (!pes || pes.chunks.length === 0) { this.pes[pid] = null; return; }
  this.pes[pid] = null;
  var total = 0, i;
  for (i = 0; i < pes.chunks.length; i++) total += pes.chunks[i].length;
  var b = new Uint8Array(total), o = 0;
  for (i = 0; i < pes.chunks.length; i++) { b.set(pes.chunks[i], o); o += pes.chunks[i].length; }
  if (b.length < 9 || b[0] !== 0 || b[1] !== 0 || b[2] !== 1) return;
  var streamId = b[3];
  var payloadOff = 6, pts = null;
  var noHeader = [0xbc, 0xbe, 0xbf, 0xf0, 0xf1, 0xff, 0xf2, 0xf8].indexOf(streamId) >= 0;
  if (!noHeader) {
    if (b.length < 9) return;
    var ptsDtsFlags = (b[7] >> 6) & 3;
    var headerLen = b[8];
    if (ptsDtsFlags === 2 || ptsDtsFlags === 3) pts = dmParsePesTimestamp(b, 9) / 90000;
    payloadOff = 9 + headerLen;
  }
  if (payloadOff >= b.length) return;
  var payload = b.subarray(payloadOff);
  if (pid === this.videoPid && this.videoType === 0x1b) this._videoPes(payload, pts);
  else if (pid === this.audioPid && this.audioType === 0x0f) this._audioPes(payload, pts);
};

DmTsDemuxer.prototype._splitNals = function (es) {
  // Split an Annex B byte stream into NAL units (data includes NAL header byte).
  var nals = [], i = 0, start = -1, startLen = 0;
  function findStart(from) {
    for (var j = from; j + 2 < es.length; j++) {
      if (es[j] === 0 && es[j + 1] === 0 && es[j + 2] === 1) return { at: j, len: 3 };
      if (es[j] === 0 && es[j + 1] === 0 && es[j + 2] === 0 && es[j + 3] === 1) return { at: j, len: 4 };
    }
    return null;
  }
  var cur = findStart(0);
  if (!cur) return nals;
  start = cur.at + cur.len; startLen = cur.len;
  while (true) {
    var nxt = findStart(start);
    var end = nxt ? nxt.at : es.length;
    // trim trailing zero bytes that belong to the next start code prefix
    while (end > start && es[end - 1] === 0 && nxt) end--;
    if (end > start) nals.push(es.subarray(start, end));
    if (!nxt) break;
    start = nxt.at + nxt.len;
  }
  return nals;
};

/* Video ES handling is STREAMING, not per-PES. PES packets do not
   align with access units — or even with NAL units: Apple's bipbop
   muxer (and others) splits the elementary stream at arbitrary byte
   offsets, so a NAL, often the big IDR, straddles two PES packets.
   Parsing each PES in isolation truncates every straddling NAL and
   the decoder rejects the damaged slices ("Decoding error"). So the
   payloads are treated as one continuous byte stream: NALs are split
   incrementally as bytes arrive, and each PES packet's PTS is kept
   as a timestamp mark for the bytes that arrived in it. An access
   unit takes the PTS of the PES packet in which its first NAL began. */
DmTsDemuxer.prototype._videoPes = function (payload, pts) {
  if (!this._vstream) {
    this._vstream = { buf: new Uint8Array(0), marks: [], au: [], auPts: null, auHasVcl: false, scLen: 0 };
  }
  var vs = this._vstream;
  if (pts !== null && pts !== undefined) vs.marks.push({ off: vs.buf.length, pts: pts });
  vs.buf = dmConcat(vs.buf, payload);
  this._drainVideo(false);
};

DmTsDemuxer.prototype._vsPtsAt = function (vs, off) {
  var pts = null;
  for (var i = 0; i < vs.marks.length; i++) {
    if (vs.marks[i].off <= off) pts = vs.marks[i].pts; else break;
  }
  return pts;
};

DmTsDemuxer.prototype._drainVideo = function (force) {
  var vs = this._vstream;
  if (!vs) return;
  var buf = vs.buf;
  function findSC(from) {
    for (var j = from; j + 2 < buf.length; j++) {
      if (buf[j] === 0 && buf[j + 1] === 0) {
        if (buf[j + 2] === 1) return { at: j, len: 3 };
        if (j + 3 < buf.length && buf[j + 2] === 0 && buf[j + 3] === 1) return { at: j, len: 4 };
      }
    }
    return null;
  }
  var sc = findSC(0);
  if (!sc) {
    if (force) { vs.buf = new Uint8Array(0); vs.marks = []; this._flushAu(); }
    return;
  }
  var nalStart = sc.at + sc.len; // data offset of the pending NAL
  var nalScAt = sc.at;           // start-code offset of the pending NAL
  var nalPts = this._vsPtsAt(vs, nalStart);
  while (true) {
    var nxt = findSC(nalStart);
    if (!nxt) break;
    // NAL data runs from nalStart to the next start code. No trailing
    // zero trimming: cabac_zero_bytes at the end of a slice are part
    // of the NAL as encoded (ffmpeg's extraction keeps them too).
    this._videoNal(buf.subarray(nalStart, nxt.at), nalPts);
    nalScAt = nxt.at;
    nalStart = nxt.at + nxt.len;
    nalPts = this._vsPtsAt(vs, nalStart);
  }
  if (force) {
    if (buf.length > nalStart) this._videoNal(buf.subarray(nalStart), nalPts);
    vs.buf = new Uint8Array(0);
    vs.marks = [];
    this._flushAu();
    return;
  }
  // Keep the pending (incomplete) NAL, from its start code onward.
  vs.buf = buf.slice(nalScAt);
  var kept = [];
  var floor = null;
  for (var i = 0; i < vs.marks.length; i++) {
    var m = { off: vs.marks[i].off - nalScAt, pts: vs.marks[i].pts };
    if (m.off < 0) floor = m; else kept.push(m);
  }
  if (floor) { floor.off = 0; kept.unshift(floor); }
  vs.marks = kept;
};

DmTsDemuxer.prototype._videoNal = function (nal, pts) {
  if (!nal || nal.length === 0) return;
  var vs = this._vstream;
  var type = nal[0] & 0x1f;
  if (type === 9) { // access unit delimiter: hard AU boundary
    this.hasAUD = true;
    this._flushAu();
    vs.auPts = pts;
    return;
  }
  if (!this.hasAUD && vs.auHasVcl) {
    // No AUDs in this stream: a new picture starts at a slice with
    // first_mb_in_slice == 0, or at SPS/PPS following a picture.
    if (((type === 1 || type === 5) && dmFirstMbInSlice(nal) === 0) || type === 7 || type === 8) {
      this._flushAu();
    }
  }
  if (vs.auPts === null && vs.au.length === 0) vs.auPts = pts;
  vs.au.push(new Uint8Array(nal));
  if (type === 1 || type === 5) vs.auHasVcl = true;
};

DmTsDemuxer.prototype._flushAu = function () {
  var vs = this._vstream;
  if (!vs || vs.au.length === 0) return;
  var au = vs.au, pts = vs.auPts;
  vs.au = []; vs.auPts = null; vs.auHasVcl = false;
  if (pts === null || pts === undefined) pts = this.lastVideoPts + this.lastVideoDur;
  this._emitAu(au, pts);
  var d = pts - this.lastVideoPts;
  if (d > 0.001 && d < 0.25) this.lastVideoDur = d;
  this.lastVideoPts = pts;
};

DmTsDemuxer.prototype._emitAu = function (nals, pts) {
  var parts = [], keyframe = false, hasVcl = false, i, nal, type;
  for (i = 0; i < nals.length; i++) {
    nal = nals[i]; type = nal[0] & 0x1f;
    if (type === 7) {
      var curSps = this.sps;
      var same = curSps && nal.length === curSps.length;
      if (same) { for (var sj = 0; sj < nal.length; sj++) { if (nal[sj] !== curSps[sj]) { same = false; break; } } }
      if (!same) { this.sps = new Uint8Array(nal); this.configSent = false; }
      continue;
    }
    if (type === 8) { this.pps = new Uint8Array(nal); continue; }
    if (type === 6) continue; // SEI: not needed for decode
    if (type === 5) keyframe = true;
    if (type === 1 || type === 5) hasVcl = true;
    parts.push(nal);
  }
  if (!hasVcl) return;
  if (this.sps && this.pps && !this.configSent) {
    this.configSent = true;
    if (this.onVideoConfig) {
      var info = { width: 0, height: 0 };
      try { info = dmParseSPS(this.sps); } catch (e) { /* decoder can still use avcC */ }
      this.onVideoConfig({
        codec: dmAvcCodecString(this.sps),
        description: dmBuildAvcc(this.sps, this.pps),
        width: info.width, height: info.height
      });
    }
  }
  if (!this.configSent) return; // wait until SPS/PPS seen
  var total = 0;
  for (i = 0; i < parts.length; i++) total += 4 + parts[i].length;
  var data = new Uint8Array(total), o = 0;
  for (i = 0; i < parts.length; i++) {
    var n = parts[i];
    data[o++] = (n.length >>> 24) & 0xff; data[o++] = (n.length >>> 16) & 0xff;

/* ---------------- Minimal MP4 demuxer ----------------
   parseMP4(arrayBuffer) -> {
     duration,                                   // seconds
     video: { codec, description, width, height,
              samples: [{data, pts, duration, keyframe}] } | null,
     audio: { codec, description, sampleRate, channels,
              samples: [{data, pts, duration}] } | null,
     error: string | null
   }

function dmU32(b, o) { return ((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0; }

  while (o + 8 <= end) {

    var header = 8;

    if (size < header || o + size > end) break;
    boxes.push({ type: type, start: o, dataStart: o + header, size: size, end: o + size });
    o += size;

}

  var boxes = dmBoxes(b, start, end);
  for (var i = 0; i < boxes.length; i++) if (boxes[i].type === type) return boxes[i];
  return null;
}

  for (var i = from; i + 4 <= to; i++) {
    if (b[i] === fourcc.charCodeAt(0) && b[i + 1] === fourcc.charCodeAt(1) &&
        b[i + 2] === fourcc.charCodeAt(2) && b[i + 3] === fourcc.charCodeAt(3)) {

  for (var i = 0; i < entries.length; i++) {
    for (var j = 0; j < entries[i].count; j++) {
      times.push(t / timescale);
      durs.push(entries[i].delta / timescale);
      t += entries[i].delta;

function dmParseMp4Track(b, trak) {
  var mdia = dmFindBox(b, trak.dataStart, trak.end, 'mdia');
  if (!mdia) return null;
  var mdhd = dmFindBox(b, mdia.dataStart, mdia.end, 'mdhd');
  var hdlr = dmFindBox(b, mdia.dataStart, mdia.end, 'hdlr');

  var stsz = dmFindBox(b, stbl.dataStart, stbl.end, 'stsz');

  var entryStart = stsd.dataStart + 8; // version/flags + entry_count
